name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  ci:
    name: Lint · Test · Build · Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # prisma generate needs no DB connection.
          # next build compiles dynamic routes but does not execute them,
          # so no real DB connection is made. A well-formed dummy URL
          # satisfies the module-level connection-string guard in db.ts.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          # AUTH_SECRET is required by next-auth at module evaluation time.
          AUTH_SECRET: ci-build-secret-not-used-at-runtime

      - name: Security audit
        # Fail only on high or critical severity.
        # The 6 remaining moderate vulnerabilities are transitive through
        # @prisma/dev (the Prisma CLI dev tool) and are not shipped to production.
        run: npm audit --audit-level=high
